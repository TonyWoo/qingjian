[package]
name = "qingjian-cli"
description = "命令行测试工具：看候选、逐键计时、回放输入日志评测、整句评测"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# 本地语音识别：转发到 qingjian-voice 的 sherpa 后端。默认关，见那个 crate 的说明
# （sherpa-onnx-sys 会在构建时下预编译静态库，且没有 windows-gnu 包）。
voice = ["qingjian-voice/sherpa"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
dotenvy.workspace = true
qingjian-core.workspace = true
qingjian-dictionary.workspace = true
qingjian-learning.workspace = true
qingjian-platform.workspace = true
qingjian-predict.workspace = true
qingjian-lm.workspace = true
qingjian-neural.workspace = true
qingjian-translate.workspace = true
qingjian-voice.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
