[package]
name = "qingjian-windows-server"
description = "Windows 输入法的 Server 进程：持有 Engine，跑在应用进程外，与 TSF DLL（../tsf）走 IPC 协议通信"
version = "0.1.4-beta.3"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "qingjian-server"
path = "src/main.rs"

# 嵌 uiAccess manifest（见 build.rs）
[build-dependencies]
embed-manifest.workspace = true

[features]
default = []
# 本地离线语音输入。默认关：sherpa-onnx-sys 的 build.rs 会按目标三元组下预编译静态库
# （Windows x64 那份 123 MB），且官方没有 windows-gnu 包 —— 开着会让 Linux 的 CI job 与
# 跨平台 check 都去下它。产品构建、安装器与真机联调带 `--features voice`。
voice = ["qingjian-voice/sherpa", "qingjian-voice/capture"]

[dependencies]
qingjian-core.workspace = true
qingjian-voice.workspace = true
qingjian-dictionary.workspace = true
qingjian-learning.workspace = true
qingjian-lm.workspace = true
qingjian-neural.workspace = true
qingjian-platform.workspace = true
qingjian-predict.workspace = true
qingjian-render.workspace = true
qingjian-translate.workspace = true
dotenvy.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
toml_edit.workspace = true

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-registry.workspace = true
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
